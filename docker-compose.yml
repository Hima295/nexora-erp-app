version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    environment:
      - DB_HOST=mariadb
      - DB_PORT=3306
      - REDIS_CACHE=redis://redis-cache:6379
      - REDIS_QUEUE=redis://redis-queue:6379
    volumes:
      - sites-vol:/home/frappe/frappe-bench/sites
      - assets-vol:/home/frappe/frappe-bench/sites/assets
    ports:
      - "8000:8000"
    depends_on:
      - mariadb
      - redis-cache
      - redis-queue

  frontend:
    image: frappe/erpnext:v15.79.0
    restart: always
    volumes:
      - sites-vol:/home/frappe/frappe-bench/sites
      - assets-vol:/home/frappe/frappe-bench/sites/assets
    ports:
      - "80:80"
    depends_on:
      - backend

  websocket:
    image: frappe/erpnext:v15.79.0
    restart: always
    volumes:
      - sites-vol:/home/frappe/frappe-bench/sites
    ports:
      - "9000:9000"
    depends_on:
      - redis-queue
      - redis-cache
    environment:
      - REDIS_QUEUE=redis://redis-queue:6379
      - REDIS_CACHE=redis://redis-cache:6379

  scheduler:
    image: frappe/erpnext:v15.79.0
    restart: always
    volumes:
      - sites-vol:/home/frappe/frappe-bench/sites
    depends_on:
      - redis-queue
      - redis-cache
    environment:
      - REDIS_QUEUE=redis://redis-queue:6379
      - REDIS_CACHE=redis://redis-cache:6379

  queue-short:
    image: frappe/erpnext:v15.79.0
    restart: always
    volumes:
      - sites-vol:/home/frappe/frappe-bench/sites
    depends_on:
      - redis-queue
      - redis-cache
    environment:
      - REDIS_QUEUE=redis://redis-queue:6379
      - REDIS_CACHE=redis://redis-cache:6379
    command: bench worker --queue short

  queue-long:
    image: frappe/erpnext:v15.79.0
    restart: always
    volumes:
      - sites-vol:/home/frappe/frappe-bench/sites
    depends_on:
      - redis-queue
      - redis-cache
    environment:
      - REDIS_QUEUE=redis://redis-queue:6379
      - REDIS_CACHE=redis://redis-cache:6379
    command: bench worker --queue long

  mariadb:
    image: mariadb:10.6
    restart: always
    environment:
      - MYSQL_ROOT_PASSWORD=nexora_root
    volumes:
      - db-vol:/var/lib/mysql

  redis-cache:
    image: redis:7-alpine
    restart: always

  redis-queue:
    image: redis:7-alpine
    restart: always

volumes:
  db-vol:
  sites-vol:
  assets-vol:
